services:

  php:
    build:
      context: .
      dockerfile: DockerFile
    working_dir: /var/www
    entrypoint: ["/var/www/docker/entrypoint.sh"]
    command: ["php-fpm"]
    restart: unless-stopped
    environment:
      DANGEROUSLY_BIND_ALL_INTERFACES: "true"
    ports:
      - "6274:6274"
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
    networks:
      - laravel

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel

  mysql:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  node:
    image: node:latest
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
  laravel_storage:
  laravel_cache: